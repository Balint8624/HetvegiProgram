<!DOCTYPE html>
<html lang="hu">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <title>Hétvégi Programok</title>
</head>

<body class="p-5">
    <header>
        <h1 class="text-center">Hétvégi Programok</h1>
    </header>

    <main>
        <section>
            <h2 class="text-center p-5">Heti legjobb ajánlatok</h2>
            <div class="cards">
                <div class="card m-2" style="width: 18rem;">
                    <img src="src/sissipark_bob2-preview.jpg" class="card-img-top" alt="Bob">
                    <div class="card-body">
                        <h5 class="card-title">Péntek</h5>
                        <p class="card-text">Pénteken lehet bobozin, nagyon jó.</p>
                        <a href="#" class="btn btn-primary">Go somewhere</a>
                    </div>
                </div>
                <div class="card m-2" style="width: 18rem;">
                    <img src="src/Crack_climbing_in_Indian_Creek,_Utah.jpg" class="card-img-top" alt="Kis mászás">
                    <div class="card-body">
                        <h5 class="card-title">Szombat</h5>
                        <p class="card-text">Szombaton fel lehet menni apróbb dombokra.</p>
                        <a href="#" class="btn btn-primary">Go somewhere</a>
                    </div>
                </div>
                <div class="card m-2" style="width: 18rem;">
                    <img src="src/outdoor-boys-cover.webp" class="card-img-top" alt="Balatoni pancsolas">
                    <div class="card-body">
                        <h5 class="card-title">Vasárnap</h5>
                        <p class="card-text">Vasárnap egy kis pancsolás a Balatonba</p>
                        <a href="#" class="btn btn-primary">Go somewhere</a>
                    </div>
                </div>
            </div>
        </section>
        <section>
            <article>

            </article>
        </section>
    </main>

    <footer class="text-center p-5">
        <p>Minden jog fenntartva!</p>
    </footer>
</body>

</html>
